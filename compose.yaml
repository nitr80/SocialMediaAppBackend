# DEPLOYMENT

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialmediaapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialmediaapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migration:
    build: .
    image: nitr80/socialmediaappbackend-api:latest
    command: ["dotnet", "SocialMediaAppBackend.dll", "--migrate"]
    restart: "no" # Runs once on deploy and terminates
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=socialmediaapp;Username=postgres;Password=${POSTGRES_PASSWORD}
    networks:
      - app-network

  api:
    build: .
    image: nitr80/socialmediaappbackend-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      JwtOptions__Key: ${JWT_SECRET}
      ConnectionStrings__Default: Host=db;Port=5432;Database=socialmediaapp;Username=postgres;Password=${POSTGRES_PASSWORD}
      BlobStorage__BucketName: ${BLOB_BUCKET_NAME}
      BlobStorage__Region: ${BLOB_REGION:-auto}
      BlobStorage__AccessKey: ${BLOB_ACCESS_KEY}
      BlobStorage__SecretKey: ${BLOB_SECRET_KEY}
      BlobStorage__ServiceUrl: ${BLOB_SERVICE_URL:-}
      BlobStorage__PublicBaseUrl: ${BLOB_PUBLIC_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - app-network

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports:
      - "16686:16686"
    networks:
      - app-network

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
