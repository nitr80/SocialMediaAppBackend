# DEVELOPMENT

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialmediaapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d socialmediaapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  migration:
    build: .
    image: nitr80/socialmediaappbackend-api:latest
    command: ["dotnet", "SocialMediaAppBackend.dll", "--migrate"]
    restart: "no" # Runs once on deploy and terminates
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=socialmediaapp;Username=postgres;Password=${POSTGRES_PASSWORD}
    networks:
      - app-network

  api:
    build: .
    image: nitr80/socialmediaappbackend-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      JwtOptions__Key: ${JWT_SECRET}
      ConnectionStrings__Default: Host=db;Port=5432;Database=socialmediaapp;Username=postgres;Password=${POSTGRES_PASSWORD}
      BlobStorage__BucketName: ${BLOB_BUCKET_NAME}
      BlobStorage__Region: ${BLOB_REGION:-auto}
      BlobStorage__AccessKey: ${BLOB_ACCESS_KEY}
      BlobStorage__SecretKey: ${BLOB_SECRET_KEY}
      BlobStorage__ServiceUrl: ${BLOB_SERVICE_URL:-}
      BlobStorage__PublicBaseUrl: ${BLOB_PUBLIC_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    networks:
      - app-network

  jaeger-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:10001 /badger"]
    volumes:
      - jaeger-data:/badger
    restart: "no"
    networks:
      - app-network

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    depends_on:
      - api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network

  loki:
    image: grafana/loki:3.6.20
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - app-network

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - app-network

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app-network

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  jaeger-data:

networks:
  app-network:
