# DEPLOYMENT

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialmediaapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-network

  api:
    build: .
    image: nitr80/socialmediaappbackend-api:latest
    # image: nitr80/socialmediaappbackend-api:1.0.0
    depends_on:
      - db
    # ports:
    #   - "8080:8080"
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8080
      JwtOptions__Key: ${JWT_SECRET}
      ConnectionStrings__Default: Host=db;Port=5432;Database=socialmediaapp;Username=postgres;Password=${POSTGRES_PASSWORD}
      BlobStorage__BucketName: ${BLOB_BUCKET_NAME}
      BlobStorage__Region: ${BLOB_REGION:-auto}
      BlobStorage__AccessKey: ${BLOB_ACCESS_KEY}
      BlobStorage__SecretKey: ${BLOB_SECRET_KEY}
      BlobStorage__ServiceUrl: ${BLOB_SERVICE_URL:-}
      BlobStorage__PublicBaseUrl: ${BLOB_PUBLIC_URL:-}
    networks:
      - app-network

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
