apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  namespace: socialmedia
  name: socialmediaappbackend-api-ingress

  annotations:
    # /metrics must not be publicly reachable; Prometheus scrapes it internally.
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        return 404;
      }

spec:
  ingressClassName: nginx

  rules:
    - host: api.localhost

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: socialmediaappbackend-api
                port:
                  number: 80