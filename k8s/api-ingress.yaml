apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  namespace: socialmedia
  name: socialmediaappbackend-api-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: api.localhost

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: socialmediaappbackend-api
                port:
                  number: 80