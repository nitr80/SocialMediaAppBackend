# Example template for the API secret. The real file (k8s/api-secret.yaml)
# is gitignored and must never be committed.
#
# Create the real secret from this template:
#   cp k8s/api-secret.example.yaml k8s/api-secret.yaml
#   # replace the placeholder below with a fresh key, e.g.: openssl rand -base64 64
#   kubectl apply -f k8s/api-secret.yaml

apiVersion: v1
kind: Secret

metadata:
  namespace: socialmedia
  name: socialmediaappbackend-api-secret

type: Opaque

stringData:
  JwtOptions__Key: "REPLACE_WITH_BASE64_64_BYTE_KEY"
