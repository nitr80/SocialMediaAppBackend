apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-nginx
  namespace: default
spec:
  replicas: 3

  selector:
    matchLabels:
      app: rolling-nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: rolling-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.26
          ports:
            - containerPort: 80