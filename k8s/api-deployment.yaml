apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: socialmedia
  name: socialmediaappbackend-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: socialmediaappbackend-api

  template:
    metadata:
      labels:
        app: socialmediaappbackend-api

    spec:
      containers:
        - name: socialmediaappbackend-api
          image: nitr80/socialmediaappbackend-api:latest

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: socialmediaappbackend-api-config

          env:
            - name: JwtOptions__Key
              valueFrom:
                secretKeyRef:
                  name: socialmediaappbackend-api-secret
                  key: JwtOptions__Key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: socialmediaappbackend-api-secret
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: socialmediaappbackend-api-secret
                  key: ConnectionStrings__Default

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"